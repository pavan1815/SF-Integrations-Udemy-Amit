<template>
  <lightning-card title="Credit Check Service">
    <div class="slds-p-around_medium">
      <lightning-input
        label="Customer ID"
        value={customerId}
        onchange={handleInput}
      ></lightning-input>

      <lightning-button
        label="Run Credit Check"
        onclick={runCheck}
        disabled={isLoading}
        variant="brand"
        class="slds-m-top_medium"
      >
      </lightning-button>

      <template if:true={isLoading}>
        <lightning-spinner
          alternative-text="Processing..."
          size="medium"
          class="slds-m-top_medium"
        >
        </lightning-spinner>
        <p class="slds-m-top_small slds-text-color_weak">
          Waiting for external service... this may take up to 60 seconds.
        </p>
      </template>

      <template if:true={result}>
        <div class="slds-m-top_medium slds-box slds-theme_success">
          <p><strong>Result:</strong> {result}</p>
        </div>
      </template>

      <template if:true={error}>
        <div class="slds-m-top_medium slds-box slds-theme_error">
          <p><strong>Error:</strong> {error}</p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
